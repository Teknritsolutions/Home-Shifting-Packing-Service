            as="font"
            type="font/woff2"
            crossorigin

        <script type="application/ld+json">
            {
                "@context": "https://schema.org",
                "@type": "WebPage",
                "name": "Something good is on the move",
                "description": "Something good is on the move — MoveNest premium packing and relocation HTML website. Thoughtful moving services and interactive front-end examples.",
                "url": "https://movenest.example/pages/coming-soon.html"
            }
        </script>
    </head>
    <body class="auth-page">
        <div class="auth-appearance" aria-label="Appearance settings">
            <button
                class="icon-btn theme-toggle"
                data-theme-toggle
                aria-label="Switch to dark mode"
                title="Switch to dark mode"
            >
                <svg
                    class=""
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="1.5"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    aria-hidden="true"
                    data-icon="moon"
                >
                    <path d="M20 14A9 9 0 0 1 10 3a9 9 0 1 0 10 11Z" />
                </svg>
            </button>
            <button
                class="icon-btn direction-toggle"
                data-rtl-toggle
                aria-label="Switch to right-to-left layout"
                title="Switch to right-to-left layout"
            >
                <svg
                    class=""
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="1.5"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    aria-hidden="true"
                    data-icon="direction"
                >
                    <path d="M20 5H4m4-3L4 5l4 3M4 12h16M4 19h16m-4-3 4 3-4 3" />
                </svg>
                <span data-direction-label>RTL</span>
            </button>
        </div>
        <main id="main">
            <!-- Content section 1 -->
            <section class="special-page standalone-special">
                <div class="site-container">
                    <a class="brand" href="../pages/home-1.html" aria-label="MoveNest home">
                        <svg viewBox="0 0 48 48" fill="none" aria-hidden="true">
                            <rect x="1" y="1" width="46" height="46" rx="13" fill="currentColor" />
                            <path
                                d="M12 32V20l6-5 6 5 6-5 6 5v12"
                                stroke="var(--logo-ink, white)"
                                stroke-width="2.2"
                                stroke-linecap="round"
                                stroke-linejoin="round"
                            />
                            <path
                                d="m16 28 8 7 8-7"
                                stroke="var(--logo-detail, #D9BE87)"
                                stroke-width="2.2"
                                stroke-linecap="round"
                                stroke-linejoin="round"
                            />
                        </svg>
                        <span class="brand-copy">
                            Move
                            <span class="brand-light">Nest</span>
                            <small>
                                <span class="brand-description-full">Packing & Relocation</span>
                                <span class="brand-description-compact">Move with care</span>
                            </small>
                        </span>
                    </a>
                    <span class="round-icon">
                        <svg
                            class=""
                            viewBox="0 0 24 24"
                            fill="none"
                            stroke="currentColor"
                            stroke-width="1.5"
                            stroke-linecap="round"
                            stroke-linejoin="round"
                            aria-hidden="true"
                            data-icon="home"
                        >
                            <path d="m3 10 9-7 9 7M5 9v12h14V9M9 21v-8h6v8" />
                        </svg>
                    </span>
                    <span class="eyebrow">A new beginning is on its way</span>
                    <h1 style="font-size: clamp(38px, 5vw, 64px)">
                        Good things
                        <br />
                        are moving in.
                    </h1>
                    <p>
                        We’re making room for something special. Explore a sample launch countdown
                        and save your interest locally.
                    </p>
                    <div
                        class="countdown"
                        data-countdown
                        aria-label="Sample launch countdown"
                    ></div>
                    <form data-form="launch" style="max-width: 470px; margin: auto">
                        <label for="launch-email">Email address</label>
                        <div class="actions">
                            <input
                                id="launch-email"
                                name="email"
                                type="email"
                                required
                                placeholder="you@example.com"
                                style="flex: 1; min-width: 130px"
                            />
                            <button class="btn" type="submit">Keep me posted</button>
                        </div>
                        <p class="form-message" role="status"></p>
                        <p class="form-note">Sample only. No email will be sent.</p>
                    </form>
                    <a class="auth-home-link" href="../pages/home-1.html">
                        Back to home
                        <svg
                            class="arrow-icon"
                            viewBox="0 0 24 24"
                            fill="none"
                            stroke="currentColor"
                            stroke-width="1.5"
                            stroke-linecap="round"
                            stroke-linejoin="round"
                            aria-hidden="true"
                            data-icon="arrow"
                        >
                            <path d="M5 12h14m-6-6 6 6-6 6" />
                        </svg>
                    </a>
                </div>
            </section>
        </main>

        <div class="toast" role="status" hidden></div>

        <script defer src="../assets/js/demo-store.js"></script>
        <script defer src="../assets/js/navigation.js"></script>
        <script defer src="../assets/js/main.js"></script>
        <script defer src="../assets/js/calculator.js"></script>
        <script defer src="../assets/js/auth-demo.js"></script>
        <script defer src="../assets/js/booking.js"></script>
        <script defer src="../assets/js/dashboard.js"></script>
        <script defer src="../assets/js/charts.js"></script>
    </body>
</html>
